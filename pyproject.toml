[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finstream"
version = "0.1.0"
description = "FinStream data engineering project"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
