version: 2

models:
  - name: mart_company_daily_performance
    description: >-
      Analytical mart providing daily company-level equity market performance,
      price movement, and trading metrics for downstream reporting and interactive
      exploration. Grain is one row per analytical company (company_key) and
      market trading date (trading_date). Joins fact_market_daily strictly to the
      current registrant mapping (is_current_registrant = true) so predecessor
      registrants do not duplicate market sessions, while retaining active SEC CIK
      as provenance.
    columns:
      - name: company_key
        description: Stable FinStream analytical company identity across marts.
        data_tests:
          - not_null
      - name: current_ticker
        description: Active market trading symbol for the company.
        data_tests:
          - not_null
      - name: current_cik
        description: Active SEC CIK associated with the current trading company.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: cik
      - name: company_name
        description: Representative legal company name from dim_company.
        data_tests:
          - not_null
      - name: trading_date
        description: Calendar date of the market trading session.
        data_tests:
          - not_null
      - name: open
        description: Opening price at market session start.
        data_tests:
          - not_null
      - name: high
        description: Highest traded price during the market session.
        data_tests:
          - not_null
      - name: low
        description: Lowest traded price during the market session.
        data_tests:
          - not_null
      - name: close
        description: Closing price at market session end.
        data_tests:
          - not_null
      - name: volume
        description: Trading volume during the session; nullable per upstream source contract.
      - name: previous_close
        description: >-
          Closing price from the immediately preceding available market trading
          session for the company. Evaluates to null on the earliest available
          session.
      - name: daily_change
        description: >-
          Absolute difference between current close and previous_close (close -
          previous_close). Null on earliest session or if previous_close is null.
      - name: daily_return
        description: >-
          Percentage price return relative to previous_close ((close /
          previous_close) - 1.0). Null on earliest session, if previous_close is
          null, or if previous_close is zero.

  - name: mart_company_financial_growth
    description: >-
      Authoritative annual company financial-growth mart over Gold financial facts
      and analytical company identity crosswalk. Primary grain is one row per
      company_key, metric_key, end_date, and unit. Preserves native corporate fiscal
      calendars and regulatory SEC source provenance (source_cik). Seamlessly unifies
      historical predecessor and current successor registrants under company_key
      without fabricating synthetic periods, cross-currency conversions, or calendar
      coercion. Representative annual facts (form 10-K or 10-K/A, fiscal_period FY)
      are ranked by filed_date desc and accession_number desc. Compares consecutive
      annual periods spanning 350 to 380 days, using ABS(previous_value) for growth rate
      and evaluating growth rate to null when previous_value is zero.
    columns:
      - name: company_key
        description: Stable FinStream analytical company identity bridging predecessor and successor entities.
        data_tests:
          - not_null
      - name: current_ticker
        description: Active market trading symbol associated with the company.
        data_tests:
          - not_null
      - name: source_cik
        description: Exact SEC CIK of the filing entity that reported the representative fact.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: cik
      - name: metric_key
        description: Canonical financial metric identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_financial_metric')
                field: metric_key
      - name: metric_name
        description: Canonical display name for the financial metric.
        data_tests:
          - not_null
      - name: period_type
        description: Accounting period context (duration or instant) defined on dim_financial_metric.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['duration', 'instant']
      - name: taxonomy
        description: Source SEC XBRL taxonomy namespace (e.g. us-gaap).
      - name: concept
        description: Source SEC XBRL concept name.
      - name: unit
        description: Currency or unit of measurement of reported fact (e.g. USD).
        data_tests:
          - not_null
      - name: fiscal_year
        description: Fiscal year associated with the filing occurrence.
      - name: start_date
        description: Start date of the reporting period; populated for duration metrics, null for instant metrics.
      - name: end_date
        description: Point-in-time or period end date of the financial observation.
        data_tests:
          - not_null
      - name: current_value
        description: Representative reported financial metric value for the period.
        data_tests:
          - not_null
      - name: previous_end_date
        description: Period end date of the immediately preceding available annual observation.
      - name: previous_value
        description: Reported financial metric value of the immediately preceding available annual observation.
      - name: absolute_change
        description: Difference between current_value and previous_value across a valid consecutive annual interval (350-380 days).
      - name: growth_rate
        description: Year-over-year relative growth ((current_value - previous_value) / ABS(previous_value)) across a valid consecutive annual interval (350-380 days); null when previous_value is zero.
      - name: form
        description: SEC filing form of the representative fact (10-K or 10-K/A).
        data_tests:
          - not_null
      - name: filed_date
        description: SEC EDGAR filing date of the representative fact.
        data_tests:
          - not_null
      - name: accession_number
        description: SEC filing accession number of the representative fact.
        data_tests:
          - not_null

  - name: mart_market_macro
    description: >-
      Retrospective current-vintage analytical mart aligning each company market
      trading session with every configured macro series. Grain is one row per
      company_key, trading_date, and series_id. For each grid row, the mart uses
      the latest current-canonical macro observation whose reference date is on
      or before the trading date, even when that observation's value is null.
      This reference-date alignment does not establish historical publication
      availability and is not suitable for point-in-time or no-lookahead
      backtesting; those uses require a future vintage/release-aware source such
      as ALFRED.
    columns:
      - name: company_key
        description: Stable FinStream analytical company identity inherited from the daily performance mart.
        data_tests:
          - not_null
      - name: current_ticker
        description: Active market trading symbol associated with the company.
        data_tests:
          - not_null
      - name: current_cik
        description: Active SEC CIK retained for regulatory provenance.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: cik
      - name: company_name
        description: Representative legal company name inherited from the daily performance mart.
      - name: trading_date
        description: Calendar date of the market trading session.
        data_tests:
          - not_null
      - name: series_id
        description: FRED macroeconomic series identifier included from the configured series dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_macro_series')
                field: series_id
      - name: market_close
        description: Closing market price from mart_company_daily_performance at retained precision.
        data_tests:
          - not_null
      - name: market_volume
        description: Trading volume from mart_company_daily_performance; nullable per the upstream source contract.
      - name: macro_observation_date
        description: >-
          Latest current-canonical macro reference date on or before trading_date,
          independent of whether macro_value is null; null when no eligible
          observation exists.
      - name: macro_value
        description: >-
          Current-canonical source value at macro_observation_date, preserved at
          source precision and including legitimate nulls; null when no eligible
          observation exists.
      - name: macro_age_days
        description: >-
          Non-negative reference-date age calculated as trading_date minus
          macro_observation_date in calendar days. It is not a publication,
          release, or availability lag and is null when no eligible observation
          exists.
