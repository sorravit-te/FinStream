x-airflow-common: &airflow-common
  image: finstream-airflow:local
  user: airflow
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /opt/airflow/finstream/docker/airflow/metadata_connection.py
    AIRFLOW_POSTGRES_DB: "${AIRFLOW_POSTGRES_DB}"
    AIRFLOW_POSTGRES_USER: "${AIRFLOW_POSTGRES_USER}"
    AIRFLOW_POSTGRES_PASSWORD: "${AIRFLOW_POSTGRES_PASSWORD}"
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro

services:
  postgres:
    image: postgres:16.15-bookworm
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_ADMIN_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
      POSTGRES_DB: postgres
      FINSTREAM_POSTGRES_DB: "${FINSTREAM_POSTGRES_DB}"
      FINSTREAM_POSTGRES_USER: "${FINSTREAM_POSTGRES_USER}"
      FINSTREAM_POSTGRES_PASSWORD: "${FINSTREAM_POSTGRES_PASSWORD}"
      AIRFLOW_POSTGRES_DB: "${AIRFLOW_POSTGRES_DB}"
      AIRFLOW_POSTGRES_USER: "${AIRFLOW_POSTGRES_USER}"
      AIRFLOW_POSTGRES_PASSWORD: "${AIRFLOW_POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/10-init-finstream-databases.sh:/docker-entrypoint-initdb.d/10-init-finstream-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    environment:
      <<: *airflow-common-environment
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_API_JWT_SECRET}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-environment
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_API_JWT_SECRET}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
